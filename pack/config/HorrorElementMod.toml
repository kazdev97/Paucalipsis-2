#Turn off all structures?
DisableStructures = false
#option for those who'd want to deactivate the atmosphere block.
DisableAtmosphereBlock = false
#Turn off all features?
DisableFeatures = false
#--------------------------------------------crucifiedsect Settings--------------------------------------------
#Whether the structure will appear.
crucifiedsectSpawning = true
#Average distance between two neighboring generation attempts.
#Range: 0 ~ 4096
crucifiedsectSpacing = 100
#Minimum distance between two neighboring attempts.
#Range: 0 ~ 4096
crucifiedsectSeparation = 60
#Defines the list of biomes where this structure can spawn.
crucifiedsectBiomes = ["plains", "sunflower_plains", "savanna", "windswept_savanna", "savanna_plateau"]
