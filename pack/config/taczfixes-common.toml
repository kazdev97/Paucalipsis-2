
[gun_level]
	#枪械的等级上限。默认值：500
	#Range: 1 ~ 10000
	max_level = 500
	#从0级到1级所需的击杀数。默认值：1
	#Range: 1 ~ 100000
	base_kills = 1
	#每升1级，升级额外所需的击杀数。默认值：5
	#Range: 0 ~ 100000
	level_increment = 5
	#是否启用铁砧使用附魔之瓶为枪械增加经验。默认值：true
	bottle_enabled = true
	#每瓶附魔之瓶增加的枪械经验值。默认值：5
	#Range: 1 ~ 10000
	bottle_exp_per_bottle = 5
	#铁砧使用附魔之瓶消耗的玩家经验等级。默认值：1
	#Range: 0 ~ 100
	bottle_cost = 1

[stepless_zoom]
	#是否启用瞄具无极变倍功能。默认值：true
	enabled = true
	#按住 Ctrl 滚动滚轮时，倍率调整速度的倍率。默认值：4
	#Range: 1.0 ~ 10.0
	zoom_ctrl_multiplier = 4.0
	#按住 Alt 滚动滚轮时，倍率调整速度的倍率。默认值：0.25
	#Range: 0.1 ~ 1.0
	zoom_alt_multiplier = 0.25

[limb_damage_multiplier]

	[limb_damage_multiplier.player]
		#玩家在站立时，碰撞箱低于此高度的部分将视为四肢。默认值：0.8
		#Range: 0.0 ~ 1.0
		limb_threshold_standing = 0.8
		#玩家在潜行时，碰撞箱低于此高度的部分将视为四肢。默认值：0.6
		#Range: 0.0 ~ 1.0
		limb_threshold_sneaking = 0.6

	[limb_damage_multiplier.gun_types]
		#默认的四肢伤害倍率。默认值：0.6
		#Range: 0.0 ~ 1.0
		default = 0.6
		#手枪的默认四肢伤害倍率。默认值：0.6
		#Range: 0.0 ~ 1.0
		pistol = 0.6
		#步枪的默认四肢伤害倍率。默认值：0.6
		#Range: 0.0 ~ 1.0
		rifle = 0.6
		#狙击枪的默认四肢伤害倍率。默认值：0.7
		#Range: 0.0 ~ 1.0
		sniper = 0.7
		#霰弹枪的默认四肢伤害倍率。默认值：0.8
		#Range: 0.0 ~ 1.0
		shotgun = 0.8
		#冲锋枪的默认四肢伤害倍率。默认值：0.5
		#Range: 0.0 ~ 1.0
		smg = 0.5
		#重型武器的默认四肢伤害倍率。默认值：0.8
		#Range: 0.0 ~ 1.0
		rpg = 0.8
		#机枪的默认四肢伤害倍率。默认值：0.7
		#Range: 0.0 ~ 1.0
		mg = 0.7
		#其他类型枪械的默认四肢伤害倍率。默认值：0.6
		#Range: 0.0 ~ 1.0
		other = 0.6

	[limb_damage_multiplier.mobs]
		#是否对非玩家实体启用四肢伤害倍率。默认值：true
		enabled = true
		#生物的碰撞箱的下半部分按此比例视为四肢。默认值：0.4
		#Range: 0.0 ~ 1.0
		threshold = 0.4
		#禁用四肢伤害倍率的实体列表。
		#Example: ["minecraft:ender_dragon"]
		excluded = ["minecraft:ender_dragon"]

[recoil_modifier]
	#是否启用首发后坐力倍率。默认值：false
	enabled = false
	#距离上次开火的时间超出此数值后开火，将视为首次开火。默认值：200
	#Range: 0 ~ 10000
	window_ms = 200
	#非首次开火的后坐力倍率。默认值：1.0
	#Range: 0.0 ~ 1.0
	factor = 1.0
	#首次开火的竖直后坐力倍率。默认值：3.0
	#Range: 1.0 ~ 10.0
	pause_factor_pitch = 3.0
	#首次开火的水平后坐力倍率。默认值：1.5
	#Range: 1.0 ~ 10.0
	pause_factor_yaw = 1.5
	#触发首发后坐力倍率所需的最小射速。默认值：300
	#Range: 0 ~ 1200
	min_rpm = 300
	#禁用首发后坐力倍率的枪械列表。
	#Example: ["rfp:m2hb", "rfp:dshkm"]
	disabled_guns = ["rfp:m2hb", "rfp:dshkm"]

[inaccuracy_modifier]
	#是否启用连射惩罚。默认值：false
	enabled = false
	#每次开火增加的散布比例。默认值：0.03
	#Range: 0.0 ~ 1.0
	increment = 0.03
	#每次开火增加的散布。默认值：0.02
	#Range: 0.0 ~ 10.0
	flat_increment = 0.02
	#连射惩罚的最大应用次数。默认值：30
	#Range: 0 ~ 1000
	max_stacks = 30
	#距离上次开火时间超出此数值后将开始回正散布。默认值：200
	#Range: 0 ~ 10000
	decay_delay_ms = 200
	#回正散布的速度。默认值：0.1
	#Range: 0.0 ~ 1.0
	decay = 0.1

[bullet_ricochet]
	#是否启用跳弹。默认值：true
	enable = true
	#跳弹所需的最小入射角。默认值：60
	#Range: 0.0 ~ 90.0
	min_angle = 60.0
	#超出此入射角后跳弹概率等同于最大跳弹概率。默认值：90
	#Range: 0.0 ~ 90.0
	max_angle = 90.0
	#以跳弹所需的最小入射角撞击方块时发生跳弹的概率。默认值：0
	#Range: 0.0 ~ 1.0
	chance_min = 0.0
	#最大跳弹概率。默认值：1
	#Range: 0.0 ~ 1.0
	chance_max = 1.0
	#子弹碰撞方块时，会发生跳弹的方块列表。
	#Example: ["minecraft:mineable/pickaxe"]
	block_tags = ["minecraft:mineable/pickaxe"]
	#禁用跳弹的枪械列表。
	#Example: ["ts:c4"]
	disabled_guns = ["ts:c4"]
	#子弹发生跳弹后造成伤害的倍率。默认值：0.2
	#Range: 0.0 ~ 1.0
	damage_multiplier = 0.2
	#每次跳弹时，反射角的余角与入射角的余角之比的最小值。默认值：0.2
	#Range: 0.0 ~ 1.0
	reflect_angle_ratio_min = 0.2
	#每次跳弹时，反射角的余角与入射角的余角之比的最大值。默认值：0.8
	#Range: 0.0 ~ 1.0
	reflect_angle_ratio_max = 0.8
	#是否允许子弹在命中方块顶面或底面时发生跳弹。默认值：false
	top_bottom_enable = false

[recoil_knockback]
	#是否启用开火击退。默认值：false
	enable = false
	#开火击退的力度大小。默认值：0.01
	#Range: 0.0 ~ 1.0
	multiplier = 0.01
	#潜行时开火击退的力度大小。默认值：0.005
	#Range: 0.0 ~ 1.0
	sneak_multiplier = 0.005
	#半自动模式的开火击退力度倍率。默认值：4
	#Range: 1.0 ~ 10.0
	semi_factor = 4.0

[misc]

	[misc.refit_toast]
		#改装界面提示文字的显示时长（毫秒）。默认值：1000
		#Range: 100 ~ 10000
		duration_ms = 1000
		#改装界面提示文字开始淡出的时长（毫秒）。默认值：500
		#Range: 0 ~ 5000
		fade_ms = 500

	[misc.refit_view_zoom]
		#改装视角模式下，滚轮缩放的最小倍率。默认值：0.5
		#Range: 0.05 ~ 1.0
		min_zoom = 0.5
		#改装视角模式下，滚轮缩放的最大倍率。默认值：4
		#Range: 1.0 ~ 100.0
		max_zoom = 4.0

	[misc.refit_button]
		#改装界面按钮（查看当前改装/保存当前方案/加载改装方案）背景的不透明度。0=全透明，1=不透明。默认值：0.45
		#Range: 0.0 ~ 1.0
		opacity = 0.45

	[misc.refit_point]
		#配件改装点数的全局默认消耗。data中未填写refit_point_consume字段的配件使用此值。默认值：0
		#Range: 0 ~ 100
		default_consume = 0

	[misc.burst_fire]
		#禁用连发模式的配件列表。
		#Example: ["ccrp:ammo_mod_hap"]
		burst_block_attachments = ["ccrp:ammo_mod_hap"]

	[misc.explosion]
		#爆炸击退是否仅对子弹生效。默认值：true
		bullet_only = false

	[misc.peek_aim]
		#是否启用探头自动开镜。默认值：true
		#需要GD656Peek模组。
		auto_aim_when_peeking = false

	[misc.unpierceable]
		#子弹无法穿透的实体列表。
		#Example: ["irons_spellbooks:shield"]
		entities = ["irons_spellbooks:shield"]

	[misc.damage]
		#降低指定实体所受子弹伤害的列表。格式: "entity_id,reduction"
		#"entity_id"为其命名空间id，"reduction"为其降低伤害的比例。
		entities = ["irons_spellbooks:shield,0.95"]
		#子弹命中实体后，此子弹是否在一定时间内忽略此实体。默认值：true
		ignore_damaged_entity_enable = true
		#子弹命中实体后，此子弹忽略此实体的时间。默认值：5000
		#Range: 0 ~ 600000
		ignore_damaged_entity_cooldown_ms = 5000

	[misc.debug]
		#禁用实体碰撞箱显示。默认值：false
		disable_hitboxes = false
		#禁用切换第三人称视角。默认值：false
		disable_third_person = false

[compat]
	#是否在使用非筒状瞄具时禁用镜内放大。默认值：true
	#需要TaCZ: Arcana模组。
	disable_arcana_magnification_for_sight = true
	#在热成像瞄具视野内隐藏的粒子列表，使用粒子ID，如lrtactical:smoke_cloud。
	#需要TaCZ: Arcana模组。
	hide_particles_in_arcana_thermal = ["lrtactical:smoke_cloud"]
	#滑铲时，应用移动时而非爬行时的腰射散布。默认值：true
	#需要ParCool模组。
	parcool_slide_as_move_inaccuracy = true
	#子弹穿透实体后是否失去追踪。默认值：true
